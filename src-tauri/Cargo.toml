[package]
name = "toolonize"
version = "0.1.0"
description = "ToolOnize — Your existing dev tools. One persistent workspace. (M1 framework shell)"
authors = ["ToolOnize"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"

[lib]
name = "toolonize_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
anyhow = { version = "1", optional = true }
portable-pty = { version = "0.9.0", optional = true }
nix = { version = "0.28", features = ["signal", "process", "fs", "poll"], optional = true }
libc = { version = "0.2", optional = true }

[features]
default = []
spike = ["dep:anyhow", "dep:portable-pty", "dep:nix", "dep:libc"]

[dev-dependencies]
# Enables tauri::test utilities for negative IPC security test (M1 gate).
# Feature unification will also enable the `test` module in normal builds,
# but it is test-only helpers and does not weaken the production IPC surface.
tauri = { version = "2.11.5", features = ["test"] }
