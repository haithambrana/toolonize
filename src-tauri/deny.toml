# cargo-deny policy (supply-chain checks, see docs/security/DEPENDENCIES.md). Run: cargo deny check
[graph]
all-features = false

[advisories]
# RustSec advisories: vulnerabilities fail the check; unmaintained crates are
# reported for crates we depend on directly.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses, plus MPL-2.0 (file-level copyleft, unmodified Tauri/WRY
# dependencies; see docs/security/DEPENDENCIES.md).
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unlicense",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
confidence-threshold = 0.9
# Mozilla's root certificate list (webpki-root-certs, via reqwest/rustls)
# used by the updater to verify GitHub's TLS certificate (ADR-019). A
# permissive license for data; allowed for that crate only.
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
