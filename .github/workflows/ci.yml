name: ci

on:
  push:
    branches: [main, m1-framework-shell, m3-terminal-session-manager]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24, verified 2026-08-27 via git ls-remote + action.yml using: node24; runner >=2.327.1 required; alt verified: v5.1.0 fbc6f39, v7.0.1 3d3c42e)
        with:
          fetch-depth: 0

      - name: Set up Node (LTS)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24, verified 2026-08-27; alt verified: v5.0.0 a0853c2, v7.0.0 8207627)
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Python (for docs checks)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (node24, verified 2026-08-27; alt verified: v6.0.0 e797f83, v7.0.0 5fda3b9)
        with:
          python-version: "3.11"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install Rust components (fmt, clippy)
        run: rustup component add rustfmt clippy

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            libssl-dev

      - name: Install npm dependencies (deterministic)
        run: npm ci

      - name: Documentation traceability
        run: python3 tools/check-doc-traceability.py

      - name: Unit tests (traceability)
        run: python3 -m unittest discover -s tools/tests -v

      - name: Public-safety scan
        run: bash tools/check-public-safety.sh

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Frontend format check
        run: npm run format:check

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Tauri build smoke (compile)
        working-directory: src-tauri
        run: cargo build

      - name: Verify no blocked lockfiles
        run: |
          if [ -f "pnpm-lock.yaml" ]; then echo "pnpm-lock.yaml must not exist" >&2; exit 1; fi
          if [ -f "yarn.lock" ]; then echo "yarn.lock must not exist" >&2; exit 1; fi
          if [ -f "bun.lockb" ]; then echo "bun.lockb must not exist" >&2; exit 1; fi
          echo "lockfile check ok"
        shell: bash
