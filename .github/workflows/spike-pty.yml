name: spike-pty

on:
  push:
    branches: [m2-pty-spike]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spike:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24)
        with:
          fetch-depth: 0

      - name: Set up Node (LTS)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24)
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Python (for docs checks)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (node24)
        with:
          python-version: "3.11"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Install Rust components (fmt, clippy)
        run: rustup component add rustfmt clippy

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            libssl-dev \
            xvfb

      - name: Install npm dependencies (deterministic)
        run: npm ci

      - name: Documentation traceability
        run: python3 tools/check-doc-traceability.py

      - name: Unit tests (traceability)
        run: python3 -m unittest discover -s tools/tests -v

      - name: Public-safety scan
        run: bash tools/check-public-safety.sh

      - name: Frontend typecheck
        run: npm run typecheck

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Frontend build (with xterm)
        run: npm run build

      - name: Rust fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust clippy (with spike feature)
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests (with spike)
        working-directory: src-tauri
        run: cargo test --all-targets --features spike

      - name: Spike PTY harness (Linux - headless)
        if: matrix.platform == 'linux'
        run: |
          timeout --signal=TERM --kill-after=10s 180s cargo run --manifest-path tools/spike-pty/Cargo.toml --bin spike-pty
          # Platform-specific CI output (not the committed docs file)
          cp target/spike-report.json target/spike-report-linux.json
          cat target/spike-report-linux.json
          echo "Checking Linux spike report platform, status, and required backends..."
          python3 -c "
          import json, sys
          report=json.load(open('target/spike-report-linux.json', encoding='utf-8'))
          platform=report.get('platform')
          if platform != 'linux':
              print(f'ERROR: expected platform linux, got {platform!r}', file=sys.stderr)
              sys.exit(1)
          data=report.get('results', [])
          fails=[r for r in data if r['status']=='FAIL']
          print(f'FAILs: {len(fails)}')
          unexpected=[r for r in data if r.get('status') != 'PASS' and not (r.get('scenario') == 'T-PTY-012 hidden console' and r.get('status') == 'NOT_VERIFIED')]
          if unexpected:
              print(f'ERROR: unexpected non-PASS Linux records: {unexpected}', file=sys.stderr)
              sys.exit(1)
          has_portable=any('portable-pty' in r.get('backend','') for r in data)
          has_direct=any('direct-unix-openpty' in r.get('backend','') for r in data)
          print(f'has_portable: {has_portable}, has_direct: {has_direct}')
          if not has_direct:
              print('ERROR: direct-unix-openpty record absent on Linux', file=sys.stderr)
              sys.exit(1)
          if not has_portable:
              print('ERROR: portable-pty record absent', file=sys.stderr)
              sys.exit(1)
          required=['T-PTY-001 spawn shells','T-PTY-002 resize','T-PTY-003 utf8','T-PTY-004 cursor DSR','T-PTY-005 ctrlc','T-PTY-006 high-volume lossless','T-PTY-013 cleanup','T-PTY-013 concurrent sessions']
          for backend in ('portable-pty-0.9.0','direct-unix-openpty'):
              for scenario in required:
                  if not any(r.get('backend') == backend and r.get('scenario') == scenario and r.get('status') == 'PASS' for r in data):
                      print(f'ERROR: missing PASS for {backend} {scenario}', file=sys.stderr)
                      sys.exit(1)
          sys.exit(1 if fails else 0)
          "

      - name: Spike PTY harness (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $cargo = Start-Process cargo -ArgumentList @("run", "--manifest-path", "tools/spike-pty/Cargo.toml", "--bin", "spike-pty") -NoNewWindow -PassThru
          if (-not $cargo.WaitForExit(180000)) {
              taskkill /PID $cargo.Id /T /F | Out-Host
              Write-Error "Windows spike harness exceeded 180 seconds"
              exit 124
          }
          if ($cargo.ExitCode -ne 0) {
              Write-Error "cargo run failed on Windows with exit $($cargo.ExitCode)"
              exit $cargo.ExitCode
          }
          # Platform-specific CI output
          Copy-Item target/spike-report.json target/spike-report-windows.json -Force
          Get-Content target/spike-report-windows.json
          Write-Host "Checking Windows spike report for FAIL and required backends..."
          python -c "
          import json, sys
          report=json.load(open('target/spike-report-windows.json', encoding='utf-8'))
          platform=report.get('platform')
          if platform != 'windows':
              print(f'ERROR: expected platform windows, got {platform!r}', file=sys.stderr)
              sys.exit(1)
          data=report.get('results', [])
          non_pass=[r for r in data if r.get('status') != 'PASS']
          print(f'non-PASS records: {len(non_pass)}')
          has_portable=any('portable-pty' in r.get('backend','') for r in data)
          has_direct=any('direct-windows-ConPTY' in r.get('backend','') for r in data)
          has_unix=any('direct-unix-openpty' in r.get('backend','') for r in data)
          print(f'has_portable: {has_portable}, has_direct_windows: {has_direct}, has_unix (should be false on Windows): {has_unix}')
          if has_unix:
              print('ERROR: report contains direct-unix-openpty but platform is windows - stale Linux report reused', file=sys.stderr)
              sys.exit(1)
          if not has_direct:
              print('ERROR: direct-windows-ConPTY record absent on Windows', file=sys.stderr)
              sys.exit(1)
          if not has_portable:
              print('ERROR: portable-pty record absent on Windows', file=sys.stderr)
              sys.exit(1)
          required=['T-PTY-001 spawn shells','T-PTY-001 shells variants','T-PTY-002 resize','T-PTY-003 utf8','T-PTY-004 cursor DSR','T-PTY-005 ctrlc','T-PTY-006 high-volume lossless','T-PTY-013 cleanup','T-PTY-013 concurrent sessions']
          for backend in ('portable-pty-0.9.0','direct-windows-ConPTY'):
              for scenario in required:
                  matches=[r for r in data if r.get('backend') == backend and r.get('scenario') == scenario]
                  if not matches or matches[0].get('status') != 'PASS':
                      print(f'ERROR: missing PASS for {backend} {scenario}: {matches}', file=sys.stderr)
                      sys.exit(1)
          volume=[r for r in data if r.get('scenario') == 'T-PTY-006 high-volume lossless']
          if not all('expected_sha256 ' in r.get('details','') and 'delivered_sha256 ' in r.get('details','') and 'exact_match true' in r.get('details','') for r in volume):
              print('ERROR: high-volume records lack exact SHA-256 evidence', file=sys.stderr)
              sys.exit(1)
          if non_pass:
              print(f'ERROR: Windows report contains non-PASS records: {non_pass}', file=sys.stderr)
              sys.exit(1)
          "
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Real WebView/xterm pipeline (Linux xvfb, spike feature)
        if: matrix.platform == 'linux'
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 120s xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            npm run tauri -- dev --no-watch --features spike --config src-tauri/tauri.spike.conf.json \
            2>&1 | tee target/real-webview.log
          python3 -c "
          import json, sys
          marker='M2_REAL_WEBVIEW_REPORT='
          lines=[line.split(marker,1)[1] for line in open('target/real-webview.log', encoding='utf-8') if marker in line]
          if len(lines) != 1:
              print(f'ERROR: expected one real WebView report, found {len(lines)}', file=sys.stderr)
              sys.exit(1)
          report=json.loads(lines[0])
          print(json.dumps(report, sort_keys=True))
          required_true=('exactByteIntegrity','xtermWriteCompleted','inputReturn','realResize')
          if not all(report.get(field) is True for field in required_true):
              print(f'ERROR: real WebView boolean gate failed: {report}', file=sys.stderr)
              sys.exit(1)
          if report.get('payloadBytes') != 262144 or report.get('deliveredPayloadBytes') != 262144:
              print(f'ERROR: real WebView byte counts failed: {report}', file=sys.stderr)
              sys.exit(1)
          expected=report.get('expectedSha256','')
          delivered=report.get('deliveredSha256','')
          if len(expected) != 64 or expected != delivered:
              print(f'ERROR: real WebView SHA-256 failed: {report}', file=sys.stderr)
              sys.exit(1)
          if report.get('processExitCode') != 0:
              print(f'ERROR: PTY child exit failed: {report}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Spike terminal UI build check (Linux xvfb)
        if: matrix.platform == 'linux'
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --features spike
          echo "spike feature builds ok"

      - name: Verify no blocked lockfiles
        run: |
          if [ -f "pnpm-lock.yaml" ]; then echo "pnpm-lock.yaml must not exist" >&2; exit 1; fi
          if [ -f "yarn.lock" ]; then echo "yarn.lock must not exist" >&2; exit 1; fi
          if [ -f "bun.lockb" ]; then echo "bun.lockb must not exist" >&2; exit 1; fi
          echo "lockfile check ok"
        shell: bash
