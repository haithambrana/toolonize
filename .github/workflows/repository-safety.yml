name: repository-safety

on:
  push:
  pull_request:

# Read-only: no writes, no deploys, no releases, no secrets.
permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      # Action SHAs are pinned to immutable commits; re-validate each SHA
      # against its upstream release tag when updating it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (node24, verified 2026-08-27 via git ls-remote + action.yml using: node24; runner >=2.327.1 required; alt verified: v5.1.0 fbc6f39, v7.0.1 3d3c42e)
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (node24, verified 2026-08-27; alt verified: v6.0.0 e797f83, v7.0.0 5fda3b9)
        with:
          python-version: "3.11"

      - name: Unit tests (release tools)
        run: python3 -m unittest discover -s tools/tests -v

      - name: Public-safety scan
        run: bash tools/check-public-safety.sh

      - name: Build-artifact guard
        run: |
          set -euo pipefail
          # Only npm's lockfile is used; other package managers' lockfiles must be absent
          forbidden=0
          for f in pnpm-lock.yaml yarn.lock bun.lockb; do
            if [ -e "$f" ]; then echo "blocked lockfile present: $f" >&2; forbidden=1; fi
          done
          # Ensure build artifacts are not tracked
          if git ls-files --error-unmatch target 2>/dev/null | grep -q .; then echo "target/ should not be tracked" >&2; forbidden=1; fi
          if git ls-files --error-unmatch node_modules 2>/dev/null | grep -q .; then echo "node_modules/ should not be tracked" >&2; forbidden=1; fi
          if git ls-files --error-unmatch dist 2>/dev/null | grep -q .; then echo "dist/ should not be tracked" >&2; forbidden=1; fi
          if [ "$forbidden" -ne 0 ]; then exit 1; fi
          echo "artifact guard: clean"

      - name: Repository structure
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE-MIT
          test -f LICENSE-APACHE
          test -f SECURITY.md
          test -f CHANGELOG.md
          test -f docs/architecture/ARCHITECTURE.md
          test -f docs/security/THREAT_MODEL.md
          echo "structure: ok"
